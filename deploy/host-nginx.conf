# Reject requests for unknown hostnames.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    return 404;
}

# Redirect both domain names to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name tibiaintel.net www.tibiaintel.net;

    return 301 https://$host$request_uri;
}

# Serve TibiaIntel over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tibiaintel.net www.tibiaintel.net;

    ssl_certificate /etc/letsencrypt/live/tibiaintel.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tibiaintel.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Backend API and VIP live connections.
    location /api/ {
        proxy_pass http://127.0.0.1:5267;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Angular frontend.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
