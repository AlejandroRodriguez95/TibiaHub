<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/" aria-label="TibiaIntel home"><span class="brand-mark" aria-hidden="true">✧</span> Tibia<span>Intel</span></a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
    <a routerLink="/characters" routerLinkActive="active" ariaCurrentWhenActive="page">Characters</a>
    <div class="tools-dropdown" routerLinkActive="active" (keydown.escape)="toolsOpen.set(false); toolsToggle.focus()">
      <button #toolsToggle class="tools-toggle" type="button" [attr.aria-expanded]="toolsOpen()" aria-controls="tools-links" (click)="toolsOpen.update(toggleTools)">Tools <span aria-hidden="true">{{ toolsOpen() ? '▴' : '▾' }}</span></button>
        <div id="tools-links" class="tools-links" [hidden]="!toolsOpen()">
          <a routerLink="/tools/npc-selling" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="toolsOpen.set(false)">NPC selling</a>
          <a routerLink="/tools/character-scan" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="toolsOpen.set(false)">Character scan</a>
        </div>
    </div>
    <a class="account-entry" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Log in</a>
    <a routerLink="/account" routerLinkActive="active" ariaCurrentWhenActive="page">My account</a>
  </nav>
</header>
<main id="main-content" class="page-shell" tabindex="-1">
  <router-outlet />
</main>
<footer class="site-footer">
  <a class="brand" routerLink="/">Tibia<span>Intel</span></a>
  <p>An independent Tibia fan project.</p>
  <a routerLink="/characters">Characters</a>
  <a routerLink="/tools/npc-selling">Tools</a>
  <a routerLink="/account">My account</a>
</footer>
