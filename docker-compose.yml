services:
  postgres:
    image: postgres:17
    container_name: tibiahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tibiahub}
      POSTGRES_USER: ${POSTGRES_USER:-tibiahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tibiahub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tibiahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tibiahub} -d ${POSTGRES_DB:-tibiahub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tibiahub_postgres_data:
