name: tibiaintel

services:
  postgres:
    image: postgres:17
    container_name: tibiaintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tibiaintel}
      POSTGRES_USER: ${POSTGRES_USER:-tibiaintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tibiaintel_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tibiaintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tibiaintel} -d ${POSTGRES_DB:-tibiaintel}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tibiaintel_postgres_data:
